[package]
name = "gray-cacheopt"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Prompt-cache watcher: warns on cache-breaking prompt prefix changes and tracks per-turn cache stats"

[lib]
name = "gray_cacheopt"
path = "src/lib.rs"

[[bin]]
name = "gray-cacheopt"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
